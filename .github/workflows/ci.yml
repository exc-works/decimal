name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Go build cache
        run: echo "GOCACHE=$RUNNER_TEMP/decimal-go-build" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            integration/mapstructure/go.sum

      - name: Show Go version
        run: go version

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./*.go ./integration/mapstructure/*.go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...

      - name: Vet BSON support
        run: go vet -tags bson ./...

      - name: Test BSON support with race detector
        run: go test -race -tags bson ./...

      - name: Vet mapstructure integration
        working-directory: integration/mapstructure
        run: go vet ./...

      - name: Test mapstructure integration with race detector
        working-directory: integration/mapstructure
        run: go test -race ./...
