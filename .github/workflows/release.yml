name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest

    env:
      GOCACHE: ${{ runner.temp }}/decimal-go-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            integration/mapstructure/go.sum

      - name: Verify tests
        run: go test ./...

      - name: Verify BSON support
        run: go test -tags bson ./...

      - name: Verify mapstructure integration
        working-directory: integration/mapstructure
        run: go test ./...

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
